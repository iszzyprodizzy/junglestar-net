<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Jungle Star</title>
<style>
body{margin:0;background:#07090d;color:#f8f9fc;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.wrap{width:min(960px,92vw);margin:8vh auto}
.card{padding:32px;border:1px solid #2c3849;border-radius:24px;background:#111722}
.eyebrow{color:#e5bd66;text-transform:uppercase;letter-spacing:.14em;font-weight:900;font-size:.75rem}
h1{font-size:clamp(2.5rem,8vw,5rem);margin:.2em 0}
p{color:#a5afbe;line-height:1.6}
a{display:inline-block;margin:8px 8px 0 0;padding:10px 14px;border:1px solid #45536a;border-radius:999px;color:#fff;text-decoration:none;font-weight:800}
</style>
</head>
<body>
<div class="wrap"><div class="card">
<div class="eyebrow" id="eyebrow">Jungle Star</div>
<h1 id="title">Room not found.</h1>
<p id="copy">This page does not exist yet.</p>
<div id="actions"></div>
</div></div>
<script>
const path=location.pathname;
const command=path.startsWith("/jungle-star-command/");
const slug=path.replace(/^\/|\/$/g,"").split("/").pop()||"room";
const title=slug.split("-").map(w=>w.charAt(0).toUpperCase()+w.slice(1)).join(" ");
if(command){
 document.getElementById("eyebrow").textContent="Jungle Star Command • Skeleton Router";
 document.getElementById("title").textContent=title+".";
 document.getElementById("copy").textContent="This Command room has a live route but its full body has not been loaded yet. Return to Command, use the Master To-Do, or keep building this room without hitting GitHub's default 404 wall.";
 document.getElementById("actions").innerHTML='<a href="/jungle-star-command/">Command Home</a><a href="/jungle-star-command/#master-to-do">Master To-Do</a><a href="/jungle-star-command/robot-hall/">Robot Hall Dubai</a>';
}else{
 document.getElementById("actions").innerHTML='<a href="/">Jungle Star Home</a>';
}
</script>
</body>
</html>
