<!doctype html>
<html lang="en">

<head>

<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1"
>

<title>
Jungle Star Command Login
</title>

<meta
  name="robots"
  content="noindex,nofollow"
>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

:root{
  --bg:#07090d;
  --panel:#111722;
  --text:#f8f9fc;
  --muted:#a5afbe;
  --line:#2c3849;
  --gold:#e5bd66;
  --green:#72dfa0;
}

*{
  box-sizing:border-box;
}

body{

  min-height:100vh;

  margin:0;

  display:grid;

  place-items:center;

  background:
    radial-gradient(
      circle at 50% 0%,
      #1b2639,
      #080b10 50%
    );

  color:var(--text);

  font-family:
    Inter,
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;

}

.login-shell{

  width:min(92vw,520px);

}

.logo{

  text-align:center;

  margin-bottom:24px;

  font-weight:950;

  letter-spacing:.08em;

}

.logo span{
  color:var(--gold);
}

.login-card{

  padding:38px;

  border:1px solid var(--line);

  border-radius:26px;

  background:
    rgba(17,23,34,.94);

  box-shadow:
    0 30px 90px rgba(0,0,0,.45);

}

.eyebrow{

  margin-bottom:10px;

  color:var(--gold);

  font-size:.75rem;

  font-weight:950;

  letter-spacing:.16em;

  text-transform:uppercase;

}

h1{

  margin:.1em 0 .3em;

  font-size:
    clamp(2.5rem,8vw,4.5rem);

  line-height:.9;

  letter-spacing:-.05em;

}

p{

  color:var(--muted);

  line-height:1.6;

}

.google-button{

  width:100%;

  margin-top:24px;

  padding:15px 18px;

  border:0;

  border-radius:999px;

  background:var(--gold);

  color:#111;

  font:inherit;

  font-weight:950;

  cursor:pointer;

}

.google-button:hover{
  filter:brightness(1.05);
}

.google-button:disabled{

  opacity:.6;

  cursor:wait;

}

.status{

  min-height:24px;

  margin-top:18px;

  color:var(--muted);

  font-size:.88rem;

}

.back{

  display:block;

  margin-top:22px;

  color:var(--muted);

  text-align:center;

  text-decoration:none;

}

.back:hover{
  color:#fff;
}

.security{

  margin-top:24px;

  padding-top:18px;

  border-top:1px solid var(--line);

  color:#748093;

  font-size:.78rem;

  line-height:1.5;

}

</style>

</head>

<body>

<div class="login-shell">

<div class="logo">

<span>★</span>
JUNGLE STAR COMMAND

</div>

<div class="login-card">

<div class="eyebrow">
Private Operations
</div>

<h1>
SIGN IN.
</h1>

<p>

Jungle Star Command is the private
operations headquarters for authorized
Jungle Star team members.

</p>

<button
  id="google-login"
  class="google-button"
  type="button"
>

Continue with Google

</button>

<div
  id="login-status"
  class="status"
></div>

<div class="security">

Authentication provided through
Google and Jungle Star Command's
Supabase authentication project.

</div>

</div>

<a
  class="back"
  href="/"
>
← Return to Jungle Star
</a>

</div>

<script>

const SUPABASE_URL =
  "https://xfknuiuqzihtgodnybwv.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_GEtDFPOEv3WS2vo76wBd-g_7BgGEPQG";

const commandSupabase =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );

const googleButton =
  document.getElementById(
    "google-login"
  );

const loginStatus =
  document.getElementById(
    "login-status"
  );

async function checkExistingSession(){

  const {
    data: { session }
  } =
    await commandSupabase.auth.getSession();

  if(session){

    window.location.replace(
      "https://junglestar.net/jungle-star-command/"
    );

  }

}

async function signInWithGoogle(){

  googleButton.disabled = true;

  loginStatus.textContent =
    "Opening Google sign-in…";

  const {
    error
  } =
    await commandSupabase.auth.signInWithOAuth({

      provider: "google",

      options: {

        redirectTo:
          "https://junglestar.net/jungle-star-command/"

      }

    });

  if(error){

    console.error(
      "Google login failed:",
      error
    );

    loginStatus.textContent =
      "Google sign-in failed. Please try again.";

    googleButton.disabled = false;

  }

}

googleButton.addEventListener(
  "click",
  signInWithGoogle
);

checkExistingSession();

</script>

</body>
</html>
