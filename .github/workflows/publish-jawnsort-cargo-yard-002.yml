name: Publish JawnSort Cargo Yard 002

on:
  push:
    branches:
      - system/jawnsort-approved-update-feed
    paths:
      - .github/workflows/publish-jawnsort-cargo-yard-002.yml

permissions:
  contents: write

jobs:
  publish-approved-update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: system/jawnsort-approved-update-feed

      - name: Download exact promoted artifact
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location 'https://sdmntprsouthcentralus.oaiusercontent.com/files/00000000-eff0-81f7-a828-53caf2c5d853/raw?se=2026-08-17T13%3A16%3A03Z&sp=r&sv=2026-02-06&sr=b&scid=d9bd0bda-f896-553b-b10d-47ebf340cecb&skoid=e9d2f8b1-028a-4cff-8eb1-d0e66fbefcca&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-17T11%3A19%3A28Z&ske=2026-08-18T11%3A19%3A28Z&sks=b&skv=2026-02-06&sig=COcfrAwflx1dNV9cRBt1E1V3ggonZOK/7KVVT3IfTIM%3D' -o artifact.zip
          mkdir artifact
          unzip -q artifact.zip -d artifact
          test -f artifact/JawnSort-Pro-Desktop-Windows-0.1.0-alpha.13-cargo-yard-dropbox.1.exe

      - name: Verify exact promoted installer
        shell: bash
        run: |
          set -euo pipefail
          installer='artifact/JawnSort-Pro-Desktop-Windows-0.1.0-alpha.13-cargo-yard-dropbox.1.exe'
          actual="$(sha256sum "$installer" | awk '{print $1}')"
          expected='71fd5f3c5e5030f4866358715c6a48b5b6f8553a089d5b4196cd944798ce15a6'
          test "$actual" = "$expected"
          echo 'PROMOTED_INSTALLER_HASH=PASS'

      - name: Publish public update asset
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag='jawnsort-0.1.0-alpha.13-cargo-yard-dropbox.1'
          installer='artifact/JawnSort-Pro-Desktop-Windows-0.1.0-alpha.13-cargo-yard-dropbox.1.exe'
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$installer" --clobber
          else
            gh release create "$tag" "$installer" --title 'JawnSort Pro Update' --notes 'Approved Cargo Yard 002 update. Adds DROP SOMETHING OFF using the existing Work Pad/Gandalf intake path and a convenience link to start a fresh ChatGPT chat. No ChatGPT API integration, scraping, browser automation, or new backend.'
          fi

      - name: Publish approved update feed
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          payload = {
              'schema': 'jawnsort-approved-update-feed-v1',
              'channel': 'approved-windows',
              'status': 'PROMOTED',
              'product': 'JawnSort Pro',
              'version': '0.1.0-alpha.13-cargo-yard-dropbox.1',
              'candidate_id': 'CARGO-YARD-002',
              'commit': 'fe4a102cd3b0498adf59ceede33212e25b211b8a',
              'installer_sha256': '71fd5f3c5e5030f4866358715c6a48b5b6f8553a089d5b4196cd944798ce15a6',
              'installer_url': 'https://github.com/iszzyprodizzy/junglestar-net/releases/download/jawnsort-0.1.0-alpha.13-cargo-yard-dropbox.1/JawnSort-Pro-Desktop-Windows-0.1.0-alpha.13-cargo-yard-dropbox.1.exe',
              'promoted_at_utc': datetime.now(timezone.utc).isoformat(),
              'glitchbot_decision': 'PROMOTE',
              'promotion_receipt': 'CARGO_YARD_002_PROMOTION_RECEIPT.json',
              'notes': 'Cargo Yard 002 Founder acceptance target. Dropbox reuses existing Work Pad/Gandalf continuity intake. Cargo Yard 001 remains rollback until Founder human acceptance.'
          }
          path = Path('jawnsort/approved-windows.json')
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(json.dumps(payload, indent=2) + '\n', encoding='utf-8')
          PY
          git config user.name 'GlitchBot'
          git config user.email 'actions@users.noreply.github.com'
          git add jawnsort/approved-windows.json
          if git diff --cached --quiet; then
            echo 'Feed already current.'
          else
            git commit -m 'promote(jawnsort): publish Cargo Yard Dropbox'
            git push origin HEAD:system/jawnsort-approved-update-feed
          fi
