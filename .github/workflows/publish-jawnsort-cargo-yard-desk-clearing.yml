name: Publish JawnSort Cargo Yard Desk Clearing

on:
  push:
    branches:
      - system/jawnsort-approved-update-feed
    paths:
      - .github/workflows/publish-jawnsort-cargo-yard-desk-clearing.yml

permissions:
  contents: write

jobs:
  publish-approved-update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: system/jawnsort-approved-update-feed

      - name: Download exact promoted artifact
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location 'https://sdmntprnorthcentralus.oaiusercontent.com/files/00000000-1dfc-822f-b792-294986313017/raw?se=2026-08-17T15%3A48%3A55Z&sp=r&sv=2026-02-06&sr=b&scid=1a22306b-1f78-53b8-9f25-522188b6d015&skoid=de71a0d5-fb02-4fce-be69-9296aced242b&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-17T14%3A18%3A12Z&ske=2026-08-18T14%3A18%3A12Z&sks=b&skv=2026-02-06&sig=1/mn5aSITrfRDLWwTWZS63cLpmYS/3TYL7oXqANX3bs%3D' -o artifact.zip
          mkdir artifact
          unzip -q artifact.zip -d artifact
          test -f artifact/JawnSort-Pro-Desktop-Windows-0.1.0-alpha.16-cargo-yard-desk-clearing.1.exe

      - name: Verify exact promoted installer
        shell: bash
        run: |
          set -euo pipefail
          installer='artifact/JawnSort-Pro-Desktop-Windows-0.1.0-alpha.16-cargo-yard-desk-clearing.1.exe'
          actual="$(sha256sum "$installer" | awk '{print $1}')"
          expected='b597a803ecb787b4366ad750fd33ce2d0da195be297aa5e8b426265ea079631c'
          test "$actual" = "$expected"
          echo 'PROMOTED_INSTALLER_HASH=PASS'

      - name: Publish public update asset
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag='jawnsort-0.1.0-alpha.16-cargo-yard-desk-clearing.1'
          installer='artifact/JawnSort-Pro-Desktop-Windows-0.1.0-alpha.16-cargo-yard-desk-clearing.1.exe'
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$installer" --clobber
          else
            gh release create "$tag" "$installer" --title 'JawnSort Pro Update' --notes 'Approved Cargo Yard desk-clearing Founder proof target. Adds CLEAR FROM YARD and CLEAR DONE as active-loading-dock visibility controls only. Clearing does not delete or rewrite original source, normalized cargo, receipts, CUZ/Transfer evidence, or durable history. Preserves Cargo Yard 002B fresh-GPT handoff semantics, Dropbox, updater, Work Pad/Gandalf, CUZ, Transfer Tank, and persisted state.'
          fi

      - name: Publish approved update feed
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          payload = {
              'schema': 'jawnsort-approved-update-feed-v1',
              'channel': 'approved-windows',
              'status': 'PROMOTED',
              'product': 'JawnSort Pro',
              'version': '0.1.0-alpha.16-cargo-yard-desk-clearing.1',
              'candidate_id': 'CARGO-YARD-DESK-CLEARING',
              'commit': '19740b592dec177e8d62ca5ad52bc24dfbd6d7a6',
              'installer_sha256': 'b597a803ecb787b4366ad750fd33ce2d0da195be297aa5e8b426265ea079631c',
              'installer_url': 'https://github.com/iszzyprodizzy/junglestar-net/releases/download/jawnsort-0.1.0-alpha.16-cargo-yard-desk-clearing.1/JawnSort-Pro-Desktop-Windows-0.1.0-alpha.16-cargo-yard-desk-clearing.1.exe',
              'promoted_at_utc': datetime.now(timezone.utc).isoformat(),
              'glitchbot_decision': 'PROMOTE',
              'promotion_receipt': 'CARGO_YARD_DESK_CLEARING_PROMOTION_RECEIPT.json',
              'notes': 'Cargo Yard desk-clearing Founder proof target. Cargo Yard is the loading dock, not the warehouse. Alpha 15 remains rollback until one real installed clear/archive recovery proof passes.'
          }
          path = Path('jawnsort/approved-windows.json')
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(json.dumps(payload, indent=2) + '\n', encoding='utf-8')
          PY
          git config user.name 'GlitchBot'
          git config user.email 'actions@users.noreply.github.com'
          git add jawnsort/approved-windows.json
          if git diff --cached --quiet; then
            echo 'Feed already current.'
          else
            git commit -m 'promote(jawnsort): publish Cargo Yard desk clearing proof target'
            git push origin HEAD:system/jawnsort-approved-update-feed
          fi
